name: Redraw night city

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths:
      - scripts/city.py

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the city from this year's contributions
        run: python scripts/city.py "${{ github.repository_owner }}" assets/city.svg
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/city.svg; then
            echo "No change today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg
          git commit -m "Redraw night city"
          git push
